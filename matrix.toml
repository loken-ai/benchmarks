# The bench matrix and the only curated data a campaign needs.
#
# Everything else is discovered, never listed here: the models come from loken's own catalogue
# (GET /api/tags), and the store paths from the config.toml loken is started with. So there is NO
# model list to keep in sync with the store, and NO machine path in the repository - only public
# facts about the comparison.

# The axes the driver sweeps. The full matrix is their product (ctx x prompts x stream x device).
#
# `context` is the window each engine is asked to reserve. `prompts` are the sizes of the input in
# tokens, each the file of that name in prompts/: the same text cut at 100, 1 000 and 10 000 tokens
# (counted with the Qwen3 tokenizer), so a rate is read across the size of the input. A window the
# prompt does not fit in, or above the one a model declares, is not measured. A shorter run
# selects a subset on the command line.
[axes]
context = [4096, 131072]
prompts = ["100", "1000", "10000"]
stream = [true, false]
device = ["gpu", "cpu"]

# No vLLM peer table: which engine can serve a model is read from the format loken declares
# (gguf -> ollama, safetensors -> vLLM), not from a hand-kept mapping. A safetensors model is its
# own catalogue entry and is measured loken vs vLLM on its own weights; the gguf of the same model
# is a separate entry, measured loken vs ollama. Two honest rows, no cross-peer to maintain.
