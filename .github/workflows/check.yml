name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the added and changed records
        if: github.event_name == 'pull_request'
        run: |
          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          git diff --name-only --diff-filter=AMR "$base" HEAD -- runs/ | grep '\.json$' > records.txt || true
          echo "$(wc -l < records.txt) record(s) added or changed"
          if [ -s records.txt ]; then xargs python3 scripts/check.py < records.txt; fi
      - name: Check every record
        if: github.event_name == 'push'
        run: python3 scripts/check.py runs/*/*.json
      - name: Build the site
        run: python3 scripts/site.py
      - name: Test
        run: python3 -m unittest discover tests
      - name: Test the charts
        run: node --test tests/*.test.js

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The protocol lives in the scripts; this is the mechanical check they get.
      - run: shellcheck -S warning scripts/bench scripts/enable-energy.sh scripts/engines/*.sh

  pages:
    if: github.event_name == 'push' && !github.event.repository.private
    needs: records
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
